services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - seadora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-seadora}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-seadora}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - seadora-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - identity-service
      - content-service
      - booking-service
      - customer-service
      - file-server

  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity.Service/Seadora.Identity.API/Dockerfile
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # ponytail: no depends_on rabbitmq; restart:on-failure already handles the startup race
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-seadora}
      - RabbitMq__Password=${RABBITMQ_PASS:-seadora}
      - JwtSettings__Secret=YourSuperSecretKeyHereYourSuperSecretKeyHere
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Seadora_Identity;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  content-service:
    build:
      context: .
      dockerfile: src/Services/Content.Service/Seadora.Content.API/Dockerfile
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-seadora}
      - RabbitMq__Password=${RABBITMQ_PASS:-seadora}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Seadora_Content;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: src/Services/Booking.Service/Seadora.Booking.API/Dockerfile
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-seadora}
      - RabbitMq__Password=${RABBITMQ_PASS:-seadora}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Seadora_Booking;Username=postgres;Password=postgres
      # SMTP relay (send-only). Set these to your Hostinger mailbox / relay creds.
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__UseSsl=${SMTP_USESSL:-true}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM:-noreply@seadoratravel.com}
      - Smtp__FromName=${SMTP_FROMNAME:-Seadora Travel}
      - Smtp__LogoUrl=${SMTP_LOGO_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: .
      dockerfile: src/Services/Customer.Service/Seadora.Customer.API/Dockerfile
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-seadora}
      - RabbitMq__Password=${RABBITMQ_PASS:-seadora}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Seadora_Customer;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  file-server:
    build:
      context: .
      dockerfile: src/Services/FileServer/Seadora.FileServer.API/Dockerfile
    volumes:
      - seadora-uploads:/app/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  seadora-website:
    build:
      context: ./src/Web/seadora-website
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000

  seadora-admin:
    build:
      context: ./src/Web/seadora-admin
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://localhost:8000

  backup:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - seadora-uploads:/data/uploads:ro
      - seadora-backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  seadora-uploads:
  seadora-db-data:
  seadora-backups:
  seadora-rabbitmq:
