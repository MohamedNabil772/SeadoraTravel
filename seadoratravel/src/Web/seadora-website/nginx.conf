server {
    listen 80;
    server_name seadoratravel.com www.seadoratravel.com localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # NOTE: TLS termination and canonical-host (www -> apex) redirects are
    # handled by the upstream edge proxy. If this server terminates TLS
    # directly, add a 443 server block plus:
    #   if ($host = www.seadoratravel.com) { return 301 https://seadoratravel.com$request_uri; }

    # --- Compression (smaller HTML/CSS/JS/SVG => better Core Web Vitals) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Never cache index.html so updates are immediate
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag "index, follow, max-image-preview:large" always;
        expires off;
    }

    # Cache immutable static assets with hash
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Crawler files: short cache so edits propagate quickly
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # Static media: long cache, real 404 for missing files
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag "index, follow, max-image-preview:large" always;
    }



    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
